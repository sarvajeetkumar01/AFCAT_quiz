<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AFCAT Quiz</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="page">

        <header class="header">

            <div class="logo">
                AFCAT Quiz
            </div>


            <nav class="navbar">

                <a href="/">Home</a>

                <a href="#">About</a>

                <a href="#">Instructions</a>

            </nav>

        </header>


        <section class="hero">

            <h1>AFCAT QUIZ</h1>

            <p>
                Prepare. Practice. Perform.
            </p>

        </section>


        <section class="subjects">

            <h2>Choose Your Subject</h2>


            <div class="subject-grid">


                <div class="subject-card">

                    <img src="{{ url_for('static', filename='images/english.png') }}" alt="english">

                    <h2>ENGLISH</h2>

                    <p>20 Questions</p>

                    <button onclick="window.location.href='/test'">
                        START QUIZ
                    </button>

                </div>


                <div class="subject-card">

                    <img src="{{ url_for('static', filename='images/calculator.png') }}" alt="maths">

                    <h2>NUMERICAL ABILITY</h2>

                    <p>20 Questions</p>

                    <button onclick="window.location.href='/test'">
                        START QUIZ
                    </button>

                </div>


                <div class="subject-card">

                    <img src="{{ url_for('static', filename='images/brain.png') }}" alt="REASONING">

                    <h2>REASONING</h2>

                    <p>20 Questions</p>

                    <button onclick="window.location.href='/test'">
                        START QUIZ
                    </button>

                </div>


                <div class="subject-card">

                    <img src="{{ url_for('static', filename='images/brain.png') }}" alt="GS">

                    <h2>GENERAL AWARENESS</h2>

                    <p>20 Questions</p>

                    <button onclick="window.location.href='/test'">
                        START QUIZ
                    </button>

                </div>


            </div>


            <div class="full-test-card">

                <img src="{{ url_for('static', filename='images/trophy.png') }}" alt="">

                <h2>FULL LENGTH AFCAT TEST</h2>

                <p>100 Questions</p>

                <button onclick="window.location.href='/test'">
                    START TEST
                </button>

            </div>


        </section>

    </div>

</body>

</html>
